[project]
name = "ezilearning-manim"
version = "0.0.0"
description = "Manim Community + ManimGL for Varin comparison (not used by the FastAPI app)"
requires-python = ">=3.11"
dependencies = [
    "manim>=0.19.0",
    "manimgl>=1.7.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ezilearning_manim"]

[tool.uv]
package = true
