[project]
name = "ezilearning"
version = "1.0.0"
description = "Interview preparation platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.2",
    "uvicorn[standard]>=0.27.1",
    "sqlalchemy>=2.0.25",
    "psycopg2-binary>=2.9.9",
    "openai>=1.0.0",
    "pdfplumber>=0.10.3",
    "python-docx>=1.1.0",
    "redis>=5.0.1",
    "pydantic[email]>=2.6.1",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.1",
    "httpx>=0.26.0",
    "google-auth>=2.27.0",
    "google-auth-oauthlib>=1.2.0",
    "google-api-python-client>=2.111.0",
    "markdown>=3.5.0",
    "xhtml2pdf>=0.2.13",
    "cryptography>=42.0.0",
    "edge-tts>=6.1.0",
]

[project.scripts]
ezilearning-seed = "cli:seed"
ezilearning-migrate = "cli:migrate"
ezilearning-varin-insights = "cli:varin_insights"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv]
package = true
