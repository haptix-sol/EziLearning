[package]
name = "varin-render"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
default = ["skia-backend"]
skia-backend = []
wgpu-backend = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[dependencies]
anyhow.workspace = true
rayon.workspace = true
varin-core = { path = "../varin-core" }
tiny-skia = "0.11"
sysinfo = "0.31"
rusttype = "0.9"
wgpu = { version = "24", optional = true, default-features = false, features = ["wgsl"] }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1.21", features = ["derive"], optional = true }
