[workspace]
members = [
  "crates/varin-core",
  "crates/varin-render",
  "crates/varin-cli",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["Varin Team"]
repository = "https://example.invalid/varin"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
